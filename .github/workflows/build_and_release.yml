name: Build LaTeX
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Build LaTeX PDF
      uses: xu-cheng/latex-action@v3
      with:
        root_file: IDP_Report.tex
        latexmk_use_lualatex: false
    
    - name: Rename PDF
      run: |
        mv IDP_Report.pdf Report.pdf
    
    - name: Upload produced PDF
      uses: actions/upload-artifact@v4
      with: 
        name: Report
        path: Report.pdf
    
    - name: Create/Update Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Conference Paper
        files: Report.pdf
        body: "Automatically generated PDF from latest commit"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}