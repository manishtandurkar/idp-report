name: Build LaTeX
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install minimal TeX Live and tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          texlive-latex-recommended latexmk biber
          
    - name: Cache apt packages (speeds repeated runs)
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-${{ hashFiles('**/IDP_Report.tex') }}
        restore-keys: |
          ${{ runner.os }}-apt-
    
    - name: Build PDF with latexmk
      run: |
        latexmk -pdf -interaction=nonstopmode -file-line-error IDP_Report.tex
    
    - name: Rename PDF
      run: |
        mv IDP_Report.pdf Report.pdf
    
    - name: Upload produced PDF
      uses: actions/upload-artifact@v4
      with: 
        name: Report
        path: Report.pdf
    
    - name: Create/Update Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Conference Paper
        files: Report.pdf
        body: "Automatically generated PDF from latest commit"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}